[project]
name = "runstore"
version = "0.1.0"
description = "On-disk run store shared by the grpo-lab trainer (writer) and API (reader)."
requires-python = ">=3.12"
dependencies = ["pyarrow>=17"]

[project.scripts]
runstore = "runstore.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
