# Virtual workspace root: no package of its own, just members + shared dev tooling.
[tool.uv.workspace]
members = ["runstore", "trainer", "api"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["grpo_lab", "grpo_api", "runstore"]

[tool.pytest.ini_options]
testpaths = ["runstore/tests", "trainer/tests", "api/tests"]
markers = ["smoke: end-to-end learning test on a tiny random model (CPU, ~tens of seconds)"]
